<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="voltCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>
    <linearGradient id="flowViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Stylized Geometric V-Left Arm -->
  <path d="M18 32 L36 32 L56 78 L47 98 L18 32 Z" fill="url(#voltCyan)" filter="url(#glow)" />
  <path d="M25 38 L34 38 L51 77 L44 91 Z" fill="#030712" opacity="0.85" />

  <!-- Flow Wave Ribbon connecting V-Right Arm -->
  <path d="M47 98 L56 78 L70 46 C75 34 85 30 94 36 C104 42 108 52 118 46 L118 38 C105 40 98 28 88 26 C75 24 64 34 58 48 Z" fill="url(#flowViolet)" filter="url(#glow)" />

  <!-- Integrated Lightning Spark Accent -->
  <polygon points="106,22 114,22 109,32 118,32 103,48 107,35 100,35" fill="url(#sparkGrad)" filter="url(#glow)" />
</svg>
